name: V9 checks

concurrency:
  group: v9-checks-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [v9-multijoueur]
  pull_request:
    branches: [v9-multijoueur]

jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer Java pour l’émulateur Firestore
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer les dépendances des tests Firestore
        run: npm install --no-audit --no-fund
      - name: Tester les règles Firestore dans l’émulateur
        run: npx firebase emulators:exec --only firestore --project demo-le-canon-v9 "npm run test:rules"
      - name: Vérifier la syntaxe du module V9
        run: node --check multiplayer-v9.js && node --check multiplayer-v9-adapter.js && node --check multiplayer-v9-controller.js
      - name: Vérifier les tests du contrat privé/public
        run: node --test tests/v9-contract.test.js tests/v9-adapter.test.js tests/v9-page.test.js tests/v9-controller.test.js
